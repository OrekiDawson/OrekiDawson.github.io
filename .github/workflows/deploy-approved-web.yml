name: Pages 正式部署与线上验证

'on':
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact immutable Web main commit SHA
        type: string
        required: true
      web_ci_run_id:
        description: Successful Web CI push run for that exact SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: oreki-pages-production
  cancel-in-progress: false

jobs:
  gate:
    name: 验证已批准的 Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.sha }}
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
    steps:
      - name: 检查不可变 Web SHA 与真实 CI 成功结果
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.approved_sha }}
          CI_RUN: ${{ inputs.web_ci_run_id }}
          SOURCE: OrekiDawson/AD-Oreki-Edition-Web
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::FAIL：源码 SHA 格式无效"; exit 1; }
          [[ "$CI_RUN" =~ ^[0-9]+$ ]] || { echo "::error::FAIL：CI Run ID 格式无效"; exit 1; }
          actual="$(gh api "repos/$SOURCE/commits/$SHA" --jq '.sha')"
          [[ "$actual" == "$SHA" ]] || exit 1
          status="$(gh api "repos/$SOURCE/compare/main...$SHA" --jq '.status')"
          [[ "$status" == identical || "$status" == behind ]] || { echo "::error::SHA not on Web main"; exit 1; }
          details="$(gh api "repos/$SOURCE/actions/runs/$CI_RUN")"
          echo "$details" | jq -e --arg sha "$SHA" '
            .head_sha == $sha and .head_branch == "main" and .event == "push"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/ci.yml"
          ' >/dev/null || { echo "::error::CI run does not match exact approved source"; exit 1; }
          jobs="$(gh api "repos/$SOURCE/actions/runs/$CI_RUN/jobs?per_page=100")"
          echo "$jobs" | jq -e '
            [.jobs[] | select(.name == "Node checks" and .conclusion == "success")] | length == 1
          ' >/dev/null || { echo "::error::Node checks not PASS"; exit 1; }
          echo "$jobs" | jq -e '
            [.jobs[] | select(.name == "Mobile Chromium smoke" and .conclusion == "success")] | length == 1
          ' >/dev/null || { echo "::error::Mobile Chromium not PASS"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "::notice::PASS：已批准 Web SHA $SHA / Web CI $CI_RUN 通过部署门禁"

  deploy:
    name: 准备、验证并部署不可变 Pages Artifact
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 检出 Pages 管理元数据
        uses: actions/checkout@v7
        with:
          path: pages-source
          persist-credentials: false
      - name: 检出精确的已批准 Web commit
        uses: actions/checkout@v7
        with:
          repository: OrekiDawson/AD-Oreki-Edition-Web
          ref: ${{ needs.gate.outputs.source_sha }}
          path: web-source
          persist-credentials: false
      - name: 组装站点，不修改 Pages main
        env:
          SHA: ${{ needs.gate.outputs.source_sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C web-source rev-parse HEAD)" == "$SHA" ]] || exit 1
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' pages-source/ _site/
          for dir in src modules public; do
            test -d "web-source/$dir"
            mkdir -p "_site/$dir"
            rsync -a --delete "web-source/$dir/" "_site/$dir/"
          done
          for file in index.html .nojekyll LICENSE MOD-LICENSE NOTICE.md; do
            test -f "web-source/$file"
            cp "web-source/$file" "_site/$file"
          done
          test -f _site/CNAME
          grep -Fxq 'oreki.net' _site/CNAME
          jq -nc --arg sha "$SHA" --argjson run "$CI_RUN" \
            '{web_sha:$sha,web_ci_run_id:$run}' > _site/deployment.json
          python3 web-source/scripts/check_pages_staging.py _site
          node --check _site/src/main.js
          node --check _site/src/game.js
          echo "PASS：已从 Web $SHA 准备不可变 Pages Artifact"
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传已验证站点为 Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: 通过官方 GitHub Pages API 部署
        id: publish
        uses: actions/deploy-pages@v5
      - name: 验证线上部署指向已批准 Web SHA
        env:
          SHA: ${{ needs.gate.outputs.source_sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "::notice::Checking deployed version, attempt $attempt"
            if curl --fail --silent --show-error --max-time 15 \
              "https://oreki.net/deployment.json?run=$GITHUB_RUN_ID" \
              | jq -e --arg sha "$SHA" --argjson ci "$CI_RUN" \
                '.web_sha == $sha and .web_ci_run_id == $ci' >/dev/null; then
              curl --fail --silent --show-error --max-time 15 https://oreki.net/src/main.js >/dev/null
              echo "PASS：线上 oreki.net 正在提供已批准 Web $SHA"
              exit 0
            fi
            sleep 8
          done
          echo "::error::FAIL：未能在 oreki.net 验证部署；禁止宣称生产 PASS"
          exit 1
      - name: 为线上移动端浏览器冒烟测试配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: 缓存锁定版本 Chromium 和 npm 下载包
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: pages-live-chromium-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('web-source/package-lock.json') }}-1.65.0-v1
      - name: 安装锁定版本线上浏览器冒烟运行器
        working-directory: web-source
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: 在 Android Chrome 视口验证线上游戏
        working-directory: web-source
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.source_sha }}
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
        run: |
          node --input-type=module <<'JS'
          import { chromium, devices } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          let context;
          let page;
          try {
            context = await browser.newContext({ ...devices['Pixel 7'] });
            page = await context.newPage();
            const errors = [];
            const consoleErrors = [];
            const expectedConsoleErrors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              // oreki.net's CSP intentionally blocks the legacy analytics loader;
              // retain it as evidence without treating it as a game failure.
              if (text.includes('googletagmanager.com/gtag/js') && text.includes('Content Security Policy')) {
                expectedConsoleErrors.push(text);
              } else {
                consoleErrors.push(text);
              }
            });
            await context.tracing.start({ screenshots: true, snapshots: true, sources: true });
            const url = 'https://oreki.net/?smoke=' + encodeURIComponent(process.env.EXPECTED_SHA);
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const deployment = await page.request.get('https://oreki.net/deployment.json?smoke=' + encodeURIComponent(process.env.EXPECTED_SHA));
            const deploymentJson = await deployment.json();
            if (deploymentJson.web_sha !== process.env.EXPECTED_SHA || Number(deploymentJson.web_ci_run_id) !== Number(process.env.CI_RUN_ID)) {
              throw new Error('deployment.json does not match approved Web SHA/CI run');
            }
            await page.waitForSelector('#ui', { state: 'visible', timeout: 60000 });
            await page.waitForFunction(() => document.querySelector('#ui')?.innerText.trim().length > 0, null, { timeout: 60000 });
            await page.waitForFunction(() => globalThis.Currency?.antimatter?.value && typeof globalThis.Currency.antimatter.value.gt === 'function', null, { timeout: 60000 });
            const before = await page.evaluate(() => globalThis.Currency.antimatter.value.toString());
            await page.waitForFunction(previous => globalThis.Currency.antimatter.value.gt(new globalThis.Decimal(previous)), before, { timeout: 30000 });
            await page.locator('#ui button').first().click({ timeout: 10000 });
            await page.screenshot({ path: 'pages-live-smoke.png', fullPage: false });
            const bodyText = await page.locator('body').innerText();
            if (!response || response.status() !== 200 || bodyText.trim().length < 10 || errors.length || consoleErrors.length) {
              throw new Error('Live mobile smoke FAIL: HTTP=' + response?.status() +
                ', bodyChars=' + bodyText.trim().length + ', pageErrors=' + errors.join(' | ') +
                ', consoleErrors=' + consoleErrors.join(' | ') +
                ', expectedConsoleErrors=' + expectedConsoleErrors.join(' | '));
            }
            console.log('PASS：线上 oreki.net 已渲染，部署身份匹配，AM Tick 增长且导航交互成功；已记录预期 CSP 阻断 ' + expectedConsoleErrors.length + ' 条');
          } catch (error) {
            await page.screenshot({ path: 'pages-live-smoke-failure.png', fullPage: false }).catch(() => {});
            throw error;
          } finally {
            await context.tracing.stop({ path: 'pages-live-smoke-trace.zip' }).catch(() => {});
            await browser.close();
          }
          JS
      - name: 上传部署失败时的线上冒烟证据
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pages-live-mobile-failure
          path: |
            web-source/pages-live-smoke.png
            web-source/pages-live-smoke-failure.png
            web-source/pages-live-smoke-trace.zip
          if-no-files-found: ignore
          retention-days: 7
