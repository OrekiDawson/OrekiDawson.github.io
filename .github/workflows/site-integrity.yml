name: Pages 静态资源完整性检查

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oreki-pages-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: CNAME, entrypoint and local assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 检查自定义域名和已知站点入口
        run: |
          set -euo pipefail
          test -f .nojekyll
          test -s index.html
          test -s src/main.js
          test -s public/icon.png
          test -d modules
          test -d public
          test -d src
          test -f CNAME
          grep -Fxq 'oreki.net' CNAME
      - name: 检查 HTML 本地链接存在于部署目录
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import sys

          root = Path.cwd().resolve()

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "link" and attrs.get("href"):
                      self.urls.append(attrs["href"])
                  elif tag in {"script", "source", "img"} and attrs.get("src"):
                      self.urls.append(attrs["src"])

          parser = Links()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          checked, missing = 0, []
          for raw in parser.urls:
              url = urlsplit(raw)
              if url.scheme or url.netloc or not url.path:
                  continue
              path = unquote(url.path).lstrip("/")
              asset = (root / path).resolve()
              try:
                  asset.relative_to(root)
              except ValueError:
                  missing.append(f"{raw}: path escapes site root")
                  continue
              checked += 1
              if not asset.is_file():
                  missing.append(f"{raw}: missing file")
          if missing:
              for item in missing:
                  print("FAIL:", item)
              sys.exit(1)
          print(f"PASS: oreki.net static entrypoint references {checked} existing local assets")
          PY
      - name: 检查部署 JavaScript 入口语法
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/game.js
          node --check src/env.js
          node --check src/merge-globals.js
          node --check src/shims.js
          node --check src/supported-browsers.js
      - name: 拒绝新增凭据和 Windows 换行
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::Manual dispatch has no trusted diff base; incremental guard skipped"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trusted comparison base"
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          changes = subprocess.check_output(
              ["git", "diff", "--name-status", "-z", "--diff-filter=ACMR", base, "HEAD"]
          ).split(bytes([0]))
          failures = []
          index = 0
          while index < len(changes) and changes[index]:
              status = changes[index].decode()
              index += 1
              if status.startswith(("R", "C")):
                  index += 1
              if index >= len(changes):
                  break
              name = os.fsdecode(changes[index])
              index += 1
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              lower = name.lower()
              if (path.suffix.lower() in {".pem", ".p12", ".pfx", ".key", ".keystore", ".jks"}
                  or path.name.lower() in {".env", "id_rsa", "id_ed25519"}
                  or re.search(r"(^|/)(credentials|secrets)[.]json$", lower)):
                  failures.append(f"credential-like file: {name}")
                  continue
              if path.stat().st_size > 4_000_000:
                  continue
              data = path.read_bytes()
              if bytes([13, 10]) in data and bytes([0]) not in data:
                  failures.append(f"CRLF line endings: {name}")
          if failures:
              for failure in failures:
                  print("FAIL:", failure)
              sys.exit(1)
          print("PASS: changed site files have no blocked credentials or CRLF")
          PY
      - name: 缓存锁定版本 actionlint
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: pages-actionlint-${{ runner.os }}-${{ runner.arch }}-v1.7.12-v1
      - name: 检查两个 Pages 工作流及其 Shell 表达式
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: 说明验证范围限制
        run: |
          echo "::notice::This is a static repository integrity check only. Live oreki.net and mobile Chromium gameplay still require separate verification."
